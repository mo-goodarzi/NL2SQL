services:
  api:
    build: .
    command: ["api"]
    env_file:
      - .env
    environment:
      - DB_PATH=/app/data/olist.db
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  ui:
    build: .
    command: ["ui"]
    env_file:
      - .env
    environment:
      - DB_PATH=/app/data/olist.db
      - API_URL=http://api:8000
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    depends_on:
      - api
    restart: unless-stopped
